<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>长期自重力量训练</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f3f4f6;color:#111827}header{background:#111827;color:white;padding:20px;position:sticky;top:0;z-index:2}h1{font-size:21px;margin:0 0 4px}header p{margin:0;color:#cbd5e1;font-size:13px}main{max-width:680px;margin:auto;padding:14px}.card{background:white;border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 3px 14px #0000000b}.big{font-size:28px;font-weight:800}.muted{color:#64748b;font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#f8fafc;border-radius:13px;padding:12px;text-align:center}.stat b{display:block;font-size:22px}button{border:0;border-radius:12px;padding:12px 15px;font-weight:700;background:#111827;color:white}button.secondary{background:#e5e7eb;color:#111827}nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}nav button{background:#e5e7eb;color:#111827}nav button.active{background:#111827;color:white}.exercise{border:1px solid #e5e7eb;border-radius:14px;padding:13px;margin:9px 0}.tag{display:inline-block;font-size:11px;background:#e2e8f0;padding:4px 7px;border-radius:99px;margin:4px 3px 0 0}.row{display:flex;gap:9px;align-items:center;justify-content:space-between}.hidden{display:none}.check{font-size:14px;line-height:1.6}summary{cursor:pointer;font-weight:700}.timer{font-size:38px;font-weight:800;text-align:center}.progress{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:#111827;width:0}</style></head><body><header><h1>长期自重力量训练</h1><p>不需要器械 · 每周 3 次 · 持续进阶</p></header><main><nav><button id="h" class="active" onclick="tab('home')">今日</button><button id="p" onclick="tab('plan')">动作库</button><button id="s" onclick="tab('stats')">记录</button></nav><section id="home"><div class="card"><div class="muted">当前阶段</div><div class="big" id="phase"></div><div class="muted" id="phaseText"></div><div class="progress"><i id="bar"></i></div></div><div class="card"><h2 id="title"></h2><div class="muted">每次约 25–35 分钟</div><div id="workout"></div><div class="row"><button onclick="done()">✓ 完成本次训练</button><button class="secondary" onclick="timer(90)">休息90秒</button></div></div><div class="card"><b>训练原则</b><p class="check">每组保留约 1–3 次余力；动作变形就降级。连续两次轻松达到上限，再升级动作。关节锐痛不是正常训练酸痛，应停止。</p></div></section><section id="plan" class="hidden"><div class="card"><h2>动作库</h2><div id="library"></div></div></section><section id="stats" class="hidden"><div class="card"><h2>长期记录</h2><div class="grid"><div class="stat"><b id="count">0</b>完成次数</div><div class="stat"><b id="week">1</b>训练周</div><div class="stat"><b id="streak">0</b>连续周</div></div><p class="muted">每完成 3 次训练进入下一训练周。第 9 周开始进入长期进阶循环。</p><button class="secondary" onclick="resetData()">重置记录</button></div></section></main><div id="tb" class="card hidden" style="position:fixed;left:12px;right:12px;bottom:12px;z-index:5"><div class="muted">休息计时</div><div class="timer" id="tv">90</div><div class="row"><button class="secondary" onclick="stopTimer()">关闭</button><button onclick="timer(30)">+30秒</button></div></div><script>
const ex=[['深蹲','椅子辅助深蹲','标准深蹲','慢速/停顿深蹲','膝盖跟脚尖方向一致，脚掌稳定。'],['俯卧撑','跪姿俯卧撑','标准俯卧撑','慢速/窄距俯卧撑','身体保持一直线，不塌腰。'],['反向弓步','扶墙辅助反向弓步','标准反向弓步','慢速/停顿反向弓步','前脚稳定，后脚向后迈。'],['臀桥','双腿臀桥','停顿臀桥','单腿臀桥','顶端收紧臀部，避免腰部代偿。'],['平板支撑','跪姿平板','标准平板','长杠杆平板/肩触碰','腹部收紧，骨盆中立。'],['侧平板','屈膝侧平板','标准侧平板','抬腿侧平板','身体保持一条线。'],['反向雪天使','小幅度反向雪天使','标准反向雪天使','慢速反向雪天使','肩胛骨向后下方移动。'],['保加利亚分腿蹲','分腿蹲','保加利亚分腿蹲','慢速/停顿保加利亚分腿蹲','前脚掌稳定，控制下沉。']];
let d=JSON.parse(localStorage.getItem('bwLong')||'{"completed":0,"week":1}'),ti;
function lev(){return d.week<=2?1:d.week<=8?2:3} function v(n){let a=ex.find(x=>x[0]==n);return a?a[lev()]:n} function workout(){let r=d.completed%3;return r==0?['A · 全身基础',[['深蹲',3,10],['俯卧撑',3,8],['臀桥',3,12],['平板支撑',3,30]]]:r==1?['B · 腿 + 核心',[['反向弓步',3,8],['保加利亚分腿蹲',2,6],['侧平板',2,20],['反向雪天使',3,10]]]:['C · 上肢 + 全身',[['俯卧撑',3,8],['深蹲',3,12],['臀桥',3,12],['平板支撑',3,30],['反向雪天使',2,10]]]} 
function render(){let l=lev(),w=workout();phase.textContent=d.week<=8?'基础阶段':'长期进阶';phaseText.textContent=d.week<=8?'建立动作质量与基础力量。':'保持动作质量，逐步升级难度。';bar.style.width=(d.week<=8?d.week/8*100:100)+'%';title.textContent=w[0];workout.innerHTML=w[1].map(x=>{let a=ex.find(e=>e[0]==x[0]);return `<div class="exercise"><b>${v(x[0])}</b><br><span class="tag">${x[1]}组</span><span class="tag">${x[2]}${x[0].includes('平板')?'秒':'次'}</span><details><summary>动作要点</summary><div class="check">${a[4]}<br>简单：${a[1]} · 标准：${a[2]} · 困难：${a[3]}</div></details></div>`}).join('');count.textContent=d.completed;week.textContent=d.week;streak.textContent=Math.floor(d.completed/3);library.innerHTML=ex.map(a=>`<div class="exercise"><b>${a[0]}</b><br><span class="tag">简单：${a[1]}</span><span class="tag">标准：${a[2]}</span><span class="tag">困难：${a[3]}</span><details><summary>要点</summary><div class="check">${a[4]}</div></details></div>`).join('')}
function save(){localStorage.setItem('bwLong',JSON.stringify(d));render()} function done(){d.completed++;if(d.completed%3==0)d.week++;save();alert('训练完成！已记录。')} function tab(x){['home','plan','stats'].forEach(a=>document.getElementById(a).classList.toggle('hidden',a!=x));h.classList.toggle('active',x=='home');p.classList.toggle('active',x=='plan');s.classList.toggle('active',x=='stats')} function timer(n){clearInterval(ti);let x=n;tb.classList.remove('hidden');tv.textContent=x;ti=setInterval(()=>{tv.textContent=--x;if(x<=0){clearInterval(ti);navigator.vibrate?.(200)}},1000)} function stopTimer(){clearInterval(ti);tb.classList.add('hidden')} function resetData(){if(confirm('确定重置所有记录？')){d={completed:0,week:1};save()}} if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');render();</script></body></html>
